name: Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: whiteborder-windows.exe
          - os: macos-13           # Intel x86_64 — runs on Intel + Apple Silicon via Rosetta
            artifact: whiteborder-macos-intel
          - os: macos-latest       # Apple Silicon arm64
            artifact: whiteborder-macos-arm64
          - os: ubuntu-latest
            artifact: whiteborder-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install pillow exifread pyinstaller

      - name: Build
        run: pyinstaller whiteborder_gui.spec

      - name: Rename binary
        shell: bash
        run: |
          if [ -f dist/whiteborder.exe ]; then
            mv dist/whiteborder.exe dist/${{ matrix.artifact }}
          else
            mv dist/whiteborder dist/${{ matrix.artifact }}
          fi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}

      - name: Upload artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
